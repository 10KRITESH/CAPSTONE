# ============================================================
# Global project configuration — CICIoT2023 Federated IDS
# Single Source of Truth for all FL, Trust, and Attack Parameters
# ============================================================

project:
  name: federated-ids
  random_seed: 42
  seeds:
    partition_seed: 42
    train_seed: 42
    attacker_seed: 42

# ---- Paths --------------------------------------------------------
paths:
  raw_data_dir: MERGED_CSV
  processed_dir: data/processed
  metadata_dir: data/metadata
  label_mapping: configs/label_mapping.yaml

# ---- Dataset Preparation ------------------------------------------
preprocessing:
  # Columns to drop (near-zero variance, confirmed in inspection)
  drop_columns:
    - ece_flag_number
    - cwr_flag_number
    - Telnet
    - SMTP
    - IRC
    - IGMP
    - DHCP

  # Columns to log1p-transform before scaling (extreme skew: max/mean > 100x)
  log_transform_columns:
    - IAT
    - Variance
    - Std
    - Rate
    - Tot sum
    - ack_count

  # Scaler applied after log-transform
  scaler: robust   # options: robust | standard | minmax

  # Train/val/test proportions (must sum to 1.0)
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15

  # Server-side validation set (disjoint from all client data)
  server_val_per_class: 625    # 8 classes × 625 = 5000 rows
  server_val_min_per_class: 100  # warn if any class falls below this

# ---- Dev Subsample ------------------------------------------------
dev_sample:
  enabled: true
  total_rows: 500_000          # stratified across 8 classes
  output_dir: data/processed/dev

# ---- Full Dataset (run later) -------------------------------------
full_dataset:
  enabled: false               # flip to true when FL pipeline is ready
  output_dir: data/processed/full

# ---- Model Architecture ------------------------------------------
model:
  in_features: 32
  hidden1: 128
  hidden2: 64
  num_classes: 8
  dropout: 0.3

# ---- Centralized Baseline Training Hyperparameters ---------------
training:
  epochs: 150
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.0001
  patience: 15           # early stopping patience (epochs)
  num_workers: 4

# ---- Federated Learning Orchestration -----------------------------
federation:
  num_clients: 10              # Single source of truth: 10 clients
  rounds: 5
  partitioning: non_iid        # options: iid | non_iid
  dirichlet_alpha: 0.5
  client_data_dir: data/partitions
  malicious_fraction: 0.20     # 20% byzantine adversaries (2 of 10)
  local_epochs: 1
  client_batch_size: 1024
  client_lr: 0.001
  client_weight_decay: 0.0001

# ---- Multi-Signal Trust, Reputation & State Machine Parameters ----
trust:
  evidence:
    rho: 0.80                           # Memory retention factor for EWMA evidence
    reputation_drop_threshold: 0.40     # Reputation threshold triggering bad_round
    cosine_threshold: -0.50             # Cosine similarity threshold for LOW_COSINE flag
    adversarial_cosine_threshold: -0.60 # Critical inverted cosine threshold
    norm_z_extreme_threshold: 15.0      # Outlier MAD Z-score threshold
    norm_z_anomaly_threshold: 1.8       # Scaled norm anomaly threshold when coupled with angular/impact skew
    global_degradation_threshold: -0.05 # Validation macro-F1 drop for GLOBAL_DEGRADATION
    target_class_degradation_threshold: -0.05 # Meaningful per-class F1 drop threshold
    target_class_min_base_f1: 0.15      # Minimum baseline F1 for per-class degradation check

  detector:
    variant: "D0"                       # options: D0 | D1 | D2 | D3
    d1_min_support: 100                 # ORACLE: minimum samples for class to evaluate target degradation
    d2_z_thresh: 3.0                    # Peer-relative MAD Z-score threshold (absolute value)
    d3_calibrated_z_thresh: null        # Calibrated z threshold from calibration seeds
    d3_calibrated_impact_thresh: null   # Calibrated impact threshold from calibration seeds
    mad_floor: 0.015                    # Robust scale floor preventing micro-noise from inflating peer Z
    energy_share_gate: 0.40             # Minimum head energy share to confirm concentrated targeted class steering
    norm_scale_power: 0.585             # Calibrated power scaling eliminating sample-count Spearman correlation

  state_machine:
    probation_threshold: 0.40           # Evidence E threshold for entering PROBATION
    quarantine_threshold: 0.70          # Evidence E threshold for entering QUARANTINED
    probation_consecutive_bad_threshold: 2 # Consecutive bad rounds in PROBATION -> QUARANTINED
    k1_recovery_rounds: 3               # Clean rounds to recover QUARANTINED -> PROBATION
    k2_recovery_rounds: 3               # Clean rounds to recover PROBATION -> TRUSTED
    soft_containment: false             # D4 continuous state factor containment
    warmup_rounds: 5                    # Warmup horizon preventing premature hard quarantine in early rounds
    state_factors:
      trusted: 1.0
      probation_floor: 0.20
      quarantined: 0.0

  reputation:
    eta: 0.20                           # Base EWMA reputation smoothing
    accelerated_eta: 0.50               # Accelerated EWMA on sharp degradation
    acceleration_impact_threshold: -0.015 # Semantic drop triggering accelerated eta
    wp: 0.60                            # Semantic validation probe weight
    ws: 0.25                            # Cosine alignment weight
    wn: 0.15                            # Robust norm Z-score weight
    low_support_dampening: 0.30         # Dampening factor for small sample classes

  aggregation:
    body_weight_power: 0.5              # Sample count scaling power (0.5 = sqrt(n_i))
    body_penalty_exponent: 3.0          # Exponent for min_rep degradation penalty
    body_penalty_threshold: 0.70        # min_rep threshold below which body is suppressed
    head_weight_power: 0.5              # Head sample count scaling power (0.5 = sqrt(n_i))
    head_penalty_exponent: 3.0          # Head reputation cubic scaling exponent
    head_lockout_threshold: 0.65        # Strict lockout cutoff: r_ic < 0.65 gets 0 weight
    use_head_salience: true             # Class-specific head update energy weighting

  collusion:
    similarity_threshold: 0.88          # Pairwise cosine threshold for sub-cluster
    divergence_threshold: 0.65          # Max cosine to geometric median for suspicion
    min_group_size: 2                   # Minimum clients to form collusion cluster
    decay_factor: 0.85                  # Temporal memory decay for collusion penalty
    collusion_penalty_flag_threshold: 0.40 # Penalty score threshold to trigger flag

  probing:
    eval_batch_size: 2048

# ---- Attack Configuration -----------------------------------------
attack:
  potent:
    band: [0.25, 0.40]                  # Calibrated RECON-share band (passed 3/3 calibration partitions)
    boost_factor: 2.0                   # Calibrated update boost factor gamma
    local_epochs: 1                     # Attacker local epochs E_atk
